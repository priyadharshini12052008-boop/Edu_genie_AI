<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }} - AI Learning Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <main class="page">
        <section class="hero">
            <div class="badge">✨ AI Learning Assistant</div>
            <h1>EduGenie</h1>
            <p>Learn smarter with AI-powered explanations, Q&A, quizzes, summaries and learning paths.</p>
        </section>

        <section class="card">
            <label for="task">Choose a task</label>
            <select id="task">
                <option value="qa">Ask a Question</option>
                <option value="explain">Explain a Topic</option>
                <option value="quiz">Generate Quiz</option>
                <option value="summarize">Summarize</option>
                <option value="learn">Recommend Learning Path</option>
            </select>

            <label for="inputText">Enter your topic, question or text</label>
            <textarea id="inputText" rows="9" placeholder="Example: Explain the Pythagoras theorem to a beginner."></textarea>

            <div class="actions">
                <button id="sampleBtn" class="secondary">Use Sample</button>
                <button id="submitBtn">Generate</button>
            </div>

            <div id="status" class="status" aria-live="polite"></div>
            <section id="result" class="result hidden"></section>
        </section>

        <footer>
            <p>EduGenie • FastAPI + Google Gemini • Student Learning Assistant</p>
        </footer>
    </main>

    <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
